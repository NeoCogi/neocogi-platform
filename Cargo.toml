[workspace]
resolver = "3"
exclude = ["target", "tmp"]
members = [
    "crates/shader/core",
    "crates/shader/plugin",
    "crates/shader/plugin/dylib",
    "crates/render/gpu",
    "crates/render/plugin",
    "crates/render/plugin/dylib",
    "crates/render/core",
    "crates/render/support",
    "crates/render/glow",
    "crates/render/webgl",
    "crates/render/vulkan",
    "crates/render/wgpu",
    "tools/native-layout",
]
default-members = ["crates/render/core"]

[workspace.package]
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
readme = "README.md"
repository = "https://github.com/NeoCogi/neocogi-platform"

[workspace.dependencies]
neocogi-shader-core = { path = "crates/shader/core" }
neocogi-shader-compiler = { path = "crates/shader/plugin", default-features = false }
neocogi-com = { version = "=0.1.0-alpha.1", default-features = false }
neocogi-com-host = { version = "=0.1.0-alpha.1", default-features = false }
neocogi-native-layout = { path = "tools/native-layout" }
neocogi-idl = { version = "=0.1.0-alpha.1" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
neocogi-render-gpu = { path = "crates/render/gpu" }
neocogi-render-core = { path = "crates/render/core" }
neocogi-render-support = { path = "crates/render/support" }
neocogi-render-glow = { path = "crates/render/glow" }
neocogi-render-webgl = { path = "crates/render/webgl" }
neocogi-render-vulkan = { path = "crates/render/vulkan" }
neocogi-render-wgpu = { path = "crates/render/wgpu" }

ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
bitflags = "2.4.1"
fontdue = "0.9.2"
glow = "0.18"
png = "0.18"
miniz_oxide = { version = "0.8.9", default-features = false }
pollster = "1"
raw-window-handle = "0.6"
rs-math3d = "=0.20.0"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
# Keep UI compile-fixture diagnostics on the established trybuild release.
trybuild = "=1.0.116"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
wgpu = "30"
naga = { version = "=30.0.1", features = ["wgsl-in", "glsl-out", "spv-in", "spv-out"] }

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false
