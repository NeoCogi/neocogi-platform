[workspace]
resolver = "3"
members = [
    "crates/render/plugin",
    "crates/render/core",
    "crates/render/support",
    "crates/render/glow",
    "crates/render/webgl",
    "crates/render/vulkan",
    "crates/render/wgpu",
    "demos/render",
]
default-members = ["crates/render/core"]

[workspace.package]
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
readme = "README.md"
repository = "https://github.com/NeoCogi/neocogi-platform"

[workspace.dependencies]
neocogi-com = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "6d4fea842e8aad97d9f6f7c6fb67abb0a6bebf4a", version = "0.1.0", default-features = false }
neocogi-idl = { git = "ssh://git@github.com/NeoCogi/neocogi-com.git", rev = "6d4fea842e8aad97d9f6f7c6fb67abb0a6bebf4a", version = "0.1.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
neocogi-demo-renderer = { path = "demos/render", default-features = false }
neocogi-render-core = { path = "crates/render/core" }
neocogi-render-support = { path = "crates/render/support" }
neocogi-render-glow = { path = "crates/render/glow" }
neocogi-render-webgl = { path = "crates/render/webgl" }
neocogi-render-vulkan = { path = "crates/render/vulkan" }
neocogi-render-wgpu = { path = "crates/render/wgpu" }

ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
bitflags = "2.4.1"
fontdue = "0.9.2"
glow = "0.18"
png = "0.18"
miniz_oxide = { version = "0.8.9", default-features = false }
pollster = "1"
rand = "0.10"
raw-window-handle = "0.6"
rs-math3d = "0.13"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
trybuild = "1.0"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
wgpu = "30"

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false

# Native assemblies consumed by the installed cargo-neocogi command.
[workspace.metadata.neocogi]
default-assembly = "full"

[workspace.metadata.neocogi.assemblies.full]
com-validation = "none"
application = { package = "neocogi-demo-full", bin = "neocogi-demo-full", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
    { package = "neocogi-assets", default-features = false, features = ["dynamic-plugin", "theme-json"] },
]
assets = [
    { from = "themes", to = "themes" },
    { from = "assets", to = "assets" },
    { from = "demos/full/assets/FACEPALM.png", to = "assets/FACEPALM.png" },
]

[workspace.metadata.neocogi.assemblies.full.variants.glow]
application-features = ["glow"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "glow"]

[workspace.metadata.neocogi.assemblies.full.variants.vulkan]
application-features = ["vulkan"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "vulkan"]

[workspace.metadata.neocogi.assemblies.full.variants.wgpu]
application-features = ["wgpu"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "wgpu"]

[workspace.metadata.neocogi.assemblies.full.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
component-features.neocogi-assets = ["dynamic-plugin"]

[workspace.metadata.neocogi.assemblies.full.variants.monolith]
linkage = "monolith"

[workspace.metadata.neocogi.assemblies.simple]
com-validation = "none"
application = { package = "neocogi-demo-basic", bin = "simple", default-features = false, features = ["glow"] }
runtime = { package = "neocogi-com-runtime", default-features = false }
plugins = [
    { package = "neocogi-ui-runtime", features = ["dynamic-plugin"] },
    { package = "neocogi-render-plugin", default-features = false, features = ["dynamic-plugin", "glow"] },
