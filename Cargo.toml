component-features.neocogi-render-plugin = ["dynamic-plugin", "vulkan"]

[workspace.metadata.neocogi.assemblies.simple.variants.wgpu]
application-features = ["wgpu"]
component-features.neocogi-render-plugin = ["dynamic-plugin", "wgpu"]

[workspace.metadata.neocogi.assemblies.simple.variants.embedded]
add-application-features = ["embed-assets"]
assets = []
omit-plugins = ["neocogi-assets"]

[workspace.metadata.neocogi.assemblies.simple.variants.monolith]
linkage = "monolith"

