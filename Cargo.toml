[workspace]
resolver = "3"
exclude = ["target", "tmp"]
members = [
    "crates/platform",
    "crates/platform-contracts",
    "crates/platform-dylib",
    "tests/browser",
    "tests/typed-buffers",
    "examples/native",
    "examples/native/plugins",
    "scripts",
]
default-members = ["crates/platform"]

[workspace.package]
version = "0.1.0-alpha.2"
authors = ["Raja Lehtihet", "Wael El Oraiby"]
edition = "2024"
license = "BSD-3-Clause AND MIT AND OFL-1.1 AND Apache-2.0 AND CC0-1.0"
repository = "https://github.com/NeoCogi/neocogi-platform"

[workspace.dependencies]
neocogi-platform-contracts = { path = "crates/platform-contracts", version = "=0.1.0-alpha.2", default-features = false }
neocogi-platform = { path = "crates/platform", version = "=0.1.0-alpha.2", default-features = false }
neocogi-com = { version = "=0.1.0", default-features = false }
neocogi-com-host = { version = "=0.1.0", default-features = false }
neocogi-idl = { version = "=0.1.0" }
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
ash = { version = "0.38", default-features = false, features = ["linked"] }
ash-window-handle = { package = "ash-window", version = "0.13" }
glow = "0.18"
pollster = "1"
raw-window-handle = "0.6"
rs-math3d = "=0.21.0"
sdl2 = { version = "0.38", features = ["raw-window-handle"] }
tempfile = "3.27"
wasm-bindgen = "=0.2.127"
web-sys = "=0.3.104"
wgpu = "30"
naga = { version = "=30.0.1", default-features = false }

[profile.release]
overflow-checks = false
opt-level = "z"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = "none"
strip = "symbols"

[profile.min-size]
inherits = "release"
incremental = false
