[package]
name = "neocogi-platform-examples"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native graphics examples with explicit static or shared-library plugin assembly"

[features]
default = ["static", "glow"]
static = ["dep:neocogi-platform-plugin", "dep:neocogi-shader-compiler"]
dynamic = ["dep:neocogi-example-plugins"]
glow = ["neocogi-platform-plugin?/glow", "neocogi-example-plugins?/glow"]
vulkan = ["neocogi-platform-plugin?/vulkan", "neocogi-example-plugins?/vulkan"]
wgpu = ["neocogi-platform-plugin?/wgpu", "neocogi-example-plugins?/wgpu"]
# Native probe acceptance belongs to the linked static fixture, not deployed shared libraries.
test-support = ["static", "neocogi-platform-plugin/test-support"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
neocogi-com = { workspace = true, features = ["std", "macros", "runtime"] }
neocogi-com-host.workspace = true
neocogi-native-layout = { path = "../../tools/native-layout" }
neocogi-render-core.workspace = true
neocogi-platform-plugin = { path = "../../crates/platform/plugin", default-features = false, optional = true }
neocogi-shader-compiler = { workspace = true, optional = true }
neocogi-example-plugins = { path = "plugins", default-features = false, optional = true }
rs-math3d.workspace = true
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
image = { version = "0.25.10", default-features = false, features = ["hdr"] }
sha2 = "0.10"

[dev-dependencies]
tempfile.workspace = true
serde_json = "1"
neocogi-native-layout-core.workspace = true

[[test]]
name = "deployment"
required-features = ["dynamic"]

[[bin]]
name = "deployment_probe"
path = "tests/support/deployment_probe.rs"
required-features = ["dynamic"]

[[bin]]
name = "triangle"
path = "src/bin/triangle.rs"
test = false

[[bin]]
name = "gltf_damaged_helmet"
path = "src/bin/gltf_damaged_helmet.rs"
test = false

[[bin]]
name = "gltf_brainstem"
path = "src/bin/gltf_brainstem.rs"
test = false
