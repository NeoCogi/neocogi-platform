[package]
name = "neocogi-example-plugins"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Executable-relative loading of explicitly prepared NeoCogi shared libraries"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-platform-contracts.workspace = true

[build-dependencies]
neocogi-platform-contracts = { workspace = true, features = ["build-support"] }

[dev-dependencies]
tempfile.workspace = true
