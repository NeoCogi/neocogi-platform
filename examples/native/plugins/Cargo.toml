[package]
name = "neocogi-example-plugins"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Executable-relative loading of explicitly prepared NeoCogi shared libraries"

[features]
default = ["glow"]
glow = []
vulkan = []
wgpu = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-platform.workspace = true

[build-dependencies]
neocogi-platform = { workspace = true, features = ["build-support"] }
