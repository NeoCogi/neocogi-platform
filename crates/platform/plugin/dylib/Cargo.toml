[package]
name = "neocogi-platform-plugin-dylib"
version.workspace = true
publish = ["crates-io"]
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Final dynamic entrypoint for neocogi-platform-plugin"

authors.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "tests/**", "schemas/**"]

[lib]
name = "nc_platform"
crate-type = ["cdylib"]

[features]
default = ["glow"]
webgl = ["provider/webgl"]
glow = ["provider/glow"]
vulkan = ["provider/vulkan"]
wgpu = ["provider/wgpu"]

[dependencies]
provider = { package = "neocogi-platform-plugin", path = "..", version = "=0.1.0-alpha.2", default-features = false }
neocogi-com = { workspace = true, default-features = false, features = ["std"] }
