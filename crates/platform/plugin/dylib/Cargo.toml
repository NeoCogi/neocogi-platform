[package]
name = "neocogi-platform-plugin-dylib"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Final dynamic entrypoint for neocogi-platform-plugin"

[lib]
name = "nc_platform"
crate-type = ["cdylib"]

[features]
default = ["glow"]
webgl = ["provider/webgl"]
glow = ["provider/glow"]
vulkan = ["provider/vulkan"]
wgpu = ["provider/wgpu"]

[dependencies]
provider = { package = "neocogi-platform-plugin", path = "..", default-features = false }
neocogi-com = { workspace = true, default-features = false, features = ["std"] }
