[package]
name = "neocogi-platform-plugin"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["crates-io"]
description = "SDL/browser platform hosting with selected GPU backend assembly"

readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "tests/**", "schemas/**"]

[lib]
# Reusable implementation; the dylib subpackage alone owns the native loader export.
name = "nc_platform"
crate-type = ["rlib"]

[features]
# Cargo adds feature flags to defaults; alternate backends require --no-default-features.
default = ["glow"]
# Native acceptance readback and owned diagnostic probes; absent from deployed builds.
test-support = ["dep:neocogi-shader-compiler"]
webgl = ["dep:glow", "neocogi-render-gpu/webgl"]
glow = ["dep:glow", "neocogi-render-gpu/glow"]
vulkan = ["neocogi-render-gpu/vulkan"]
wgpu = ["neocogi-render-gpu/wgpu"]

[dependencies]
neocogi-shader-compiler = { workspace = true, optional = true }
neocogi-render-gpu.workspace = true
neocogi-shader-core.workspace = true
neocogi-render-core.workspace = true
neocogi-render-support.workspace = true
rs-math3d.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std", "runtime"] }
glow = { workspace = true, optional = true }

[dev-dependencies]
neocogi-shader-compiler.workspace = true
tempfile.workspace = true
# Native and browser unit tests own their runtime; they must not require a deployed shared library.
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-host.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
sdl2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Clipboard", "Navigator", "Document", "DomRect", "Element", "Event", "EventTarget", "FocusEvent",
    "CssStyleDeclaration", "HtmlTextAreaElement", "HtmlCanvasElement", "HtmlElement",
    "KeyboardEvent", "PointerEvent", "WebGl2RenderingContext", "WheelEvent", "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
