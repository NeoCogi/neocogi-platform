[package]
name = "neocogi-platform"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NeoCogi platform with builtin audio, windowing, shader compilation and selectable renderers"
publish = ["crates-io"]
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**", "examples/**", "docs/**"]

[lib]
crate-type = ["rlib"]

[features]
default = ["glow"]
# Audio/window hosting is builtin; select exactly one renderer for this platform.
glow = ["dep:glow"]
vulkan = ["dep:spirv", "dep:ash", "dep:ash-window-handle", "dep:raw-window-handle"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:raw-window-handle"]
webgl = ["dep:glow"]
# Optional source frontend; backends and test-support do not enable it implicitly.
shader-python = []
test-support = ["neocogi-platform-contracts/test-support", "wgpu?/counters"]

[dependencies]
neocogi-platform-contracts.workspace = true
neocogi-com = { workspace = true, features = ["alloc", "std", "macros", "runtime"] }
rs-math3d.workspace = true
spirv = { version = "=0.4.0", optional = true }
glow = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2.workspace = true
ash = { workspace = true, optional = true }
ash-window-handle = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { workspace = true, features = [
    "AudioContext", "AudioContextOptions", "AudioContextState", "AudioDestinationNode", "AudioNode",
    "AudioWorklet", "Worklet", "AudioWorkletNode", "AudioWorkletNodeOptions", "ChannelCountMode",
    "Blob", "BlobPropertyBag", "Url", "MessagePort", "MessageEvent", "ErrorEvent",
    "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamAudioSourceNode", "MediaStreamTrack", "MediaStreamTrackState",
    "Clipboard", "Navigator", "Document", "DomRect", "Element", "Event", "EventTarget", "FocusEvent",
    "CssStyleDeclaration", "HtmlTextAreaElement", "HtmlCanvasElement", "HtmlElement",
    "KeyboardEvent", "PointerEvent", "WebGl2RenderingContext", "WheelEvent", "Window",
] }

[dev-dependencies]
neocogi-platform-contracts = { workspace = true, features = ["test-support"] }
neocogi-com-host.workspace = true
tempfile.workspace = true
serde_json = "1"

[[test]]
name = "audio"

[[test]]
name = "gpu_shader_budget"
required-features = ["test-support", "glow"]

[[test]]
name = "platform_compiler_activation"

[[test]]
name = "platform_owned_window_error"

[[test]]
name = "compiler"
required-features = ["test-support"]

[[test]]
name = "shader_targets"

[[test]]
name = "sexp_compiler"

[[test]]
name = "compiler_plugin"

[[test]]
name = "shader_optimization"
required-features = ["test-support"]

[[test]]
name = "python_compiler"
required-features = ["shader-python"]

[[example]]
name = "shader_compile"
