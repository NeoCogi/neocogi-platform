[package]
name = "neocogi-platform"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NeoCogi platform contracts, graphics, shader compiler and optional native/browser providers"
publish = ["crates-io"]
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "build_support/**", "tests/**", "schemas/**"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# Backend implementations are additive; the optional platform assembly selects one.
glow = ["dep:glow", "dep:sdl2", "dep:web-sys"]
vulkan = ["dep:ash", "dep:ash-window-handle", "dep:raw-window-handle", "dep:sdl2"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:raw-window-handle", "dep:sdl2"]
webgl = ["dep:glow", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
platform = []
shader-compiler = ["dep:naga"]
build-support = ["dep:neocogi-idl", "dep:tempfile", "dep:serde", "dep:serde_json", "dep:sha2"]
test-support = ["shader-compiler", "wgpu?/counters"]

[dependencies]
neocogi-com = { workspace = true, features = ["alloc", "std", "macros", "runtime"] }
rs-math3d.workspace = true
naga = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
neocogi-idl = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { workspace = true, optional = true }
ash = { workspace = true, optional = true }
ash-window-handle = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "=0.4.77", optional = true }
js-sys = { version = "=0.3.104", optional = true }
web-sys = { workspace = true, optional = true, features = [
    "Clipboard", "Navigator", "Document", "DomRect", "Element", "Event", "EventTarget", "FocusEvent",
    "CssStyleDeclaration", "HtmlTextAreaElement", "HtmlCanvasElement", "HtmlElement",
    "KeyboardEvent", "PointerEvent", "WebGl2RenderingContext", "WheelEvent", "Window",
] }

[build-dependencies]
neocogi-idl.workspace = true
syn.workspace = true
quote.workspace = true

[dev-dependencies]
neocogi-com-host.workspace = true
tempfile.workspace = true
serde_json = "1"
naga.workspace = true

[[test]]
name = "gpu_shader_budget"
required-features = ["test-support"]

[[test]]
name = "platform_compiler_activation"
required-features = ["platform", "shader-compiler"]

[[test]]
name = "platform_owned_window_error"
required-features = ["platform", "shader-compiler"]
