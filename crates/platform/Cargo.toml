[package]
name = "neocogi-platform"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NeoCogi platform contracts, graphics, shader compiler and optional native/browser providers"
publish = ["crates-io"]
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**", "examples/**"]

[lib]
crate-type = ["rlib"]

[features]
default = []
# Backend implementations are additive; the optional platform assembly selects one.
glow = ["shader-compiler", "shader-glsl", "dep:glow", "dep:sdl2", "dep:web-sys"]
vulkan = ["shader-compiler", "shader-spirv", "dep:ash", "dep:ash-window-handle", "dep:raw-window-handle", "dep:sdl2"]
wgpu = ["shader-compiler", "shader-wgsl", "dep:wgpu", "dep:pollster", "dep:raw-window-handle", "dep:sdl2"]
webgl = ["shader-compiler", "shader-glsl", "dep:glow", "dep:web-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]
platform = ["audio"]
# PCM services can be linked independently of any renderer or native window.
audio = ["dep:sdl2", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
shader-compiler = []
# Output selection never enables the optional compiler or graphics dependencies.
shader-wgsl = []
shader-spirv = ["dep:spirv"]
shader-glsl = []
test-support = ["neocogi-platform-contracts/test-support", "shader-compiler", "shader-wgsl", "wgpu?/counters"]

[dependencies]
neocogi-platform-contracts.workspace = true
neocogi-com = { workspace = true, features = ["alloc", "std", "macros", "runtime"] }
rs-math3d.workspace = true
spirv = { version = "=0.4.0", optional = true }
glow = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { workspace = true, optional = true }
ash = { workspace = true, optional = true }
ash-window-handle = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "=0.4.77", optional = true }
js-sys = { version = "=0.3.104", optional = true }
web-sys = { workspace = true, optional = true, features = [
    "AudioContext", "AudioContextOptions", "AudioContextState", "AudioDestinationNode", "AudioNode",
    "AudioWorklet", "Worklet", "AudioWorkletNode", "AudioWorkletNodeOptions", "ChannelCountMode",
    "Blob", "BlobPropertyBag", "Url", "MessagePort", "MessageEvent", "ErrorEvent",
    "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaStreamAudioSourceNode", "MediaStreamTrack", "MediaStreamTrackState",
    "Clipboard", "Navigator", "Document", "DomRect", "Element", "Event", "EventTarget", "FocusEvent",
    "CssStyleDeclaration", "HtmlTextAreaElement", "HtmlCanvasElement", "HtmlElement",
    "KeyboardEvent", "PointerEvent", "WebGl2RenderingContext", "WheelEvent", "Window",
] }

[dev-dependencies]
neocogi-platform-contracts = { workspace = true, features = ["test-support"] }
neocogi-com-host.workspace = true
tempfile.workspace = true
serde_json = "1"

[[test]]
name = "audio"
required-features = ["audio"]

[[test]]
name = "gpu_shader_budget"
required-features = ["test-support", "shader-glsl"]

[[test]]
name = "platform_compiler_activation"
required-features = ["platform", "shader-compiler"]

[[test]]
name = "platform_owned_window_error"
required-features = ["platform", "shader-compiler"]

[[test]]
name = "compiler"
required-features = ["test-support"]

[[test]]
name = "shader_targets"
required-features = ["shader-compiler"]

[[test]]
name = "sexp_compiler"
required-features = ["shader-compiler"]

[[test]]
name = "compiler_plugin"
required-features = ["shader-compiler"]

[[example]]
name = "shader_compile"
required-features = ["shader-compiler"]
