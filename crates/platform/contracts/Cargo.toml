[package]
name = "neocogi-platform-contracts"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Platform input and native-window ABI contracts for NeoCogi"
# Cargo owner for IDL module `neocogi.platform`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e706c6174666f726d"

[package.metadata.neocogi-contract]
module = "neocogi.platform"
source = "idl/neocogi/platform"

[dependencies]
neocogi-com = { workspace = true, default-features = false, features = ["macros", "alloc"] }
neocogi-renderer-contracts.workspace = true

[features]
default = ["std"]
std = ["neocogi-com/std"]

[build-dependencies]
neocogi-idl.workspace = true
