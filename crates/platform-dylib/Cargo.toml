[package]
name = "neocogi-platform-dylib"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin final COM shared-library entrypoints for NeoCogi Platform"
publish = ["crates-io"]
readme = "README.md"
autoexamples = false
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "examples/**", "tests/**"]

[lib]
name = "nc_platform"
crate-type = ["cdylib"]

# Cargo's named library-example targets provide one final root per backend.
# required-features selects exactly the library requested by the first cargo build.
[features]
default = ["glow"]
glow = ["neocogi-platform/glow"]
vulkan = ["neocogi-platform/vulkan"]
wgpu = ["neocogi-platform/wgpu"]

[dependencies]
neocogi-platform = { workspace = true, features = ["platform"] }
neocogi-com = { workspace = true, features = ["std"] }

[[example]]
name = "nc_platform_glow"
path = "examples/nc_platform_glow.rs"
crate-type = ["cdylib"]
required-features = ["glow"]

[[example]]
name = "nc_platform_vulkan"
path = "examples/nc_platform_vulkan.rs"
crate-type = ["cdylib"]
required-features = ["vulkan"]

[[example]]
name = "nc_platform_wgpu"
path = "examples/nc_platform_wgpu.rs"
crate-type = ["cdylib"]
required-features = ["wgpu"]
