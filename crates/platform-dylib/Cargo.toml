[package]
name = "neocogi-platform-dylib"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Thin final COM shared-library entrypoints for NeoCogi Platform"
publish = ["crates-io"]
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**", "docs/**"]

[lib]
name = "nc_platform"
crate-type = ["cdylib"]

# The selected backend is part of this one normal Cargo library target.
[features]
default = ["glow"]
glow = ["neocogi-platform/glow"]
vulkan = ["neocogi-platform/vulkan"]
wgpu = ["neocogi-platform/wgpu"]
shader-python = ["neocogi-platform/shader-python"]

[dependencies]
neocogi-platform = { workspace = true, features = ["platform"] }
neocogi-com = { workspace = true, features = ["std"] }
