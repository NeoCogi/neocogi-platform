[package]
name = "neocogi-render-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-neutral renderer SPI for NeoCogi"
publish = ["crates-io"]

readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "tests/**", "schemas/**"]

[dependencies]
neocogi-com = { workspace = true, features = ["alloc", "std", "macros"] }
rs-math3d.workspace = true

[build-dependencies]
neocogi-platform-build.workspace = true
syn.workspace = true
quote.workspace = true

[dev-dependencies]
tempfile.workspace = true
