[package]
name = "neocogi-render-support"
version.workspace = true
publish = ["crates-io"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "tests/**", "schemas/**"]
description = "Shared graphics preparation and platform algorithms for NeoCogi"

[dependencies]
neocogi-render-gpu.workspace = true
neocogi-render-core.workspace = true
neocogi-com = { workspace = true, features = ["std"] }

[dev-dependencies]
neocogi-render-gpu = {workspace=true,features=["test-support"]}
neocogi-shader-compiler.workspace = true
