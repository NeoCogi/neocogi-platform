[package]
name = "neocogi-render-wgpu"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neocogi-render-gpu.workspace = true
neocogi-render-core.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
sdl2.workspace = true
wgpu.workspace = true

[dev-dependencies]
neocogi-shader-compiler.workspace = true
neocogi-com = { workspace = true, features = ["runtime"] }
# Native lifetime regressions observe actual unreleased images; deployed builds keep counters off.
wgpu = { workspace = true, features = ["counters"] }
