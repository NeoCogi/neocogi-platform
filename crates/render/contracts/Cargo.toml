[package]
name = "neocogi-renderer-contracts"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Renderer-neutral COM contracts shared by NeoCogi graphics producers and backends"
# Cargo owner for IDL module `neocogi.renderer`: UTF-8 bytes encoded as hex.
# Demangle by decoding hex pairs after `nc_contract_`; this is not a library name.
links = "nc_contract_6e656f636f67692e72656e6465726572"

[package.metadata.neocogi-contract]
module = "neocogi.renderer"
source = "idl/neocogi/renderer"

[dependencies]
neocogi-com = { workspace = true, features = ["macros"] }
rs-math3d.workspace = true

[build-dependencies]
neocogi-idl.workspace = true
