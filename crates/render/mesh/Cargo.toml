[package]
name = "neocogi-render-mesh"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
glow = ["dep:glow", "dep:neocogi-render-glow"]
webgl = ["glow"]
vulkan = ["dep:ash", "dep:neocogi-render-vulkan"]
wgpu = ["dep:neocogi-render-wgpu", "dep:wgpu"]

[dependencies]
neocogi-com = { workspace = true, features = ["alloc", "std", "macros"] }
ash = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
neocogi-render-core.workspace = true
neocogi-render-glow = { workspace = true, optional = true }
neocogi-render-vulkan = { workspace = true, optional = true }
neocogi-render-wgpu = { workspace = true, optional = true }
rs-math3d.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
pollster.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sdl2.workspace = true

[build-dependencies]
neocogi-idl.workspace = true
