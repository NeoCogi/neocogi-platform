[package]
name = "neocogi-render-glow"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
neocogi-render-gpu.workspace = true
glow.workspace = true
neocogi-render-core.workspace = true
neocogi-render-support.workspace = true

# Native GPU regression tests can run with SDL's Mesa-compatible offscreen video driver.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sdl2.workspace = true
neocogi-com = { workspace = true, features = ["runtime"] }

[dev-dependencies]
neocogi-shader-compiler.workspace = true

# Physical contexts must outlive every owned native allocation, including late resource drops.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["HtmlCanvasElement", "WebGl2RenderingContext"] }
