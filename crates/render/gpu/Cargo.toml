[package]
name = "neocogi-render-gpu"
version.workspace = true
publish = ["crates-io"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable GPU resources and command recording with optional concrete graphics backends"

readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "tests/**", "schemas/**"]

[dependencies]
neocogi-render-core.workspace = true
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-shader-core.workspace = true
glow = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2 = { workspace = true, optional = true }
ash = { workspace = true, optional = true }
ash-window-handle = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, optional = true, features = ["HtmlCanvasElement", "WebGl2RenderingContext"] }

[dev-dependencies]
neocogi-shader-core = { workspace = true, features = ["test-support"] }
neocogi-shader-compiler.workspace = true
neocogi-com = { workspace = true, features = ["runtime"] }
tempfile.workspace = true
serde_json = "1"

[features]
# CPU-only admission/recording has no graphics dependency or implicit production backend.
default = []
glow = ["dep:glow", "dep:sdl2", "dep:web-sys"]
vulkan = ["dep:ash", "dep:ash-window-handle", "dep:raw-window-handle", "dep:sdl2"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:raw-window-handle", "dep:sdl2"]
# Browser canvas assembly reuses the same GL executor and concrete resource family.
webgl = ["glow"]
# Virtual CPU fixtures and optional WGPU allocation observations; never enables WGPU itself.
test-support = ["wgpu?/counters"]

[[test]]
name="shader_budget"
required-features=["test-support"]
