[package]
name = "neocogi-render-plugin"
version = "0.9.0-alpha.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The Rust target also defines the deployed shared-library name on each platform.
name = "nc_render"
# The implementation is linked once by cargo-neocogi's generated cdylib root;
# emitting a second package-local cdylib would only duplicate optimized work.
crate-type = ["rlib"]

[features]
default = ["glow"]
webgl = ["dep:glow", "dep:neocogi-render-webgl", "neocogi-demo-renderer/webgl"]
glow = ["dep:glow", "dep:neocogi-render-glow", "neocogi-demo-renderer/glow"]
vulkan = ["dep:neocogi-render-vulkan", "neocogi-demo-renderer/vulkan"]
wgpu = ["dep:neocogi-render-wgpu", "neocogi-demo-renderer/wgpu"]
dynamic-plugin = []

[dependencies]
neocogi-renderer-contracts.workspace = true
neocogi-platform-contracts.workspace = true
neocogi-render-core.workspace = true
neocogi-render-webgl = { workspace = true, optional = true }
neocogi-render-glow = { workspace = true, optional = true }
neocogi-render-vulkan = { workspace = true, optional = true }
neocogi-render-wgpu = { workspace = true, optional = true }
neocogi-render-support.workspace = true
neocogi-demo-renderer.workspace = true
neocogi-demo-render-contracts.workspace = true
rs-math3d.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
glow = { workspace = true, optional = true }

[dev-dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Document", "DomRect", "Element", "Event", "EventTarget", "FocusEvent",
    "CssStyleDeclaration", "HtmlTextAreaElement", "HtmlCanvasElement", "HtmlElement",
    "KeyboardEvent", "PointerEvent", "WebGl2RenderingContext", "WheelEvent", "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
neocogi-ui-core-contracts.workspace = true
neocogi-ui-nodes-contracts.workspace = true
neocogi-gfx-contracts.workspace = true
neocogi-com = { workspace = true, features = ["static-runtime"] }
