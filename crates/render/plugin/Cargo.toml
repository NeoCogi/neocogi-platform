[package]
name = "neocogi-render-plugin"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The Rust target also defines the deployed shared-library name on each platform.
name = "nc_render"
crate-type = ["rlib", "cdylib"]

[features]
# Cargo adds feature flags to defaults; alternate backends require --no-default-features.
default = ["glow"]
webgl = ["dep:glow", "dep:neocogi-render-webgl", "neocogi-render-mesh/webgl"]
glow = ["dep:glow", "dep:neocogi-render-glow", "neocogi-render-mesh/glow"]
vulkan = ["dep:neocogi-render-vulkan", "neocogi-render-mesh/vulkan"]
wgpu = ["dep:neocogi-render-wgpu", "neocogi-render-mesh/wgpu"]
dynamic-plugin = ["dep:neocogi-native-runtime-link"]

[dependencies]
neocogi-renderer-contracts.workspace = true
neocogi-platform-contracts.workspace = true
neocogi-render-core.workspace = true
neocogi-render-webgl = { workspace = true, optional = true }
neocogi-render-glow = { workspace = true, optional = true }
neocogi-render-vulkan = { workspace = true, optional = true }
neocogi-render-wgpu = { workspace = true, optional = true }
neocogi-render-support.workspace = true
neocogi-render-mesh.workspace = true
neocogi-render-mesh-contracts.workspace = true
rs-math3d.workspace = true
neocogi-com = { workspace = true, default-features = false, features = ["macros", "std"] }
glow = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Native and browser unit tests own their runtime; they must not require a deployed shared library.
neocogi-com = { workspace = true, features = ["static-runtime"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native target code and its shared runtime use the same Cargo profile.
neocogi-native-runtime-link = { workspace = true, optional = true }
sdl2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Clipboard", "Navigator", "Document", "DomRect", "Element", "Event", "EventTarget", "FocusEvent",
    "CssStyleDeclaration", "HtmlTextAreaElement", "HtmlCanvasElement", "HtmlElement",
    "KeyboardEvent", "PointerEvent", "WebGl2RenderingContext", "WheelEvent", "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
neocogi-ui-core-contracts.workspace = true
neocogi-ui-nodes-contracts.workspace = true
neocogi-gfx-contracts.workspace = true
