[package]
name = "neocogi-shader-compiler-dylib"
version.workspace = true
publish = ["crates-io"]
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Final dynamic entrypoint for neocogi-shader-compiler"

authors.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "tests/**", "schemas/**"]

[lib]
name = "nc_shader_compiler"
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
provider = { package = "neocogi-shader-compiler", path = "..", version = "=0.1.0-alpha.2", default-features = false }
neocogi-com = { workspace = true, default-features = false, features = ["std"] }
