[package]
name = "neocogi-shader-compiler"
version.workspace = true
publish = ["crates-io"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CPU-only portable shader compiler COM provider"

readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "tests/**", "schemas/**"]

[lib]
name = "nc_shader_compiler"
crate-type = ["rlib"]

[features]
default = []

[dependencies]
neocogi-com = { workspace = true, features = ["std", "macros"] }
neocogi-shader-core.workspace = true
neocogi-render-core.workspace = true
naga.workspace = true

[build-dependencies]
neocogi-platform-build.workspace = true
