[package]
name = "neocogi-ui-demo-renderer"
version = "0.0.0"
publish = false
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
glow = ["dep:glow", "dep:neocogi-ui-renderer-glow"]
webgl = ["glow"]
vulkan = ["dep:ash", "dep:neocogi-ui-renderer-vulkan"]
wgpu = ["dep:neocogi-ui-renderer-wgpu", "dep:wgpu"]

[dependencies]
microui-demo-contracts.workspace = true
ash = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
neocogi-ui-runtime.workspace = true
neocogi-ui-renderer-glow = { workspace = true, optional = true }
neocogi-ui-renderer-vulkan = { workspace = true, optional = true }
neocogi-ui-renderer-wgpu = { workspace = true, optional = true }
rs-math3d.workspace = true
wgpu = { workspace = true, optional = true }
