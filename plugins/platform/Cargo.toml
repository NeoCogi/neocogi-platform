[package]
name = "microui-plugin-platform"
version = "0.9.0-alpha.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["glow"]
webgl = ["dep:glow", "dep:microui-redux-renderer-webgl-canvas", "microui-redux-demo-renderer/webgl"]
glow = ["dep:glow", "dep:microui-redux-renderer-glow", "microui-redux-demo-renderer/glow"]
vulkan = ["dep:microui-redux-renderer-vulkan", "microui-redux-demo-renderer/vulkan"]
wgpu = ["dep:microui-redux-renderer-wgpu", "microui-redux-demo-renderer/wgpu"]
dynamic-plugin = []

[dependencies]
microui-contracts.workspace = true
microui-ui.workspace = true
microui-redux-renderer-webgl-canvas = { workspace = true, optional = true }
microui-redux-renderer-glow = { workspace = true, optional = true }
microui-redux-renderer-vulkan = { workspace = true, optional = true }
microui-redux-renderer-wgpu = { workspace = true, optional = true }
microui-redux-renderer-support.workspace = true
microui-redux-demo-renderer.workspace = true
microui-demo-contracts.workspace = true
rs-math3d.workspace = true
nc-com = { workspace = true, features = ["macros", "std"] }
glow = { workspace = true, optional = true }

[dev-dependencies]
microui-redux-demo-assets = { workspace = true, features = ["prebuilt-atlas", "prebuilt-com"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sdl2.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "Document", "DomRect", "Element", "Event", "EventTarget", "FocusEvent",
    "CssStyleDeclaration", "HtmlTextAreaElement", "HtmlCanvasElement", "HtmlElement",
    "KeyboardEvent", "PointerEvent", "WebGl2RenderingContext", "WheelEvent", "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
microui-redux.workspace = true
microui-plugin-ui = { path = "../ui" }
nc-com = { workspace = true, features = ["static-runtime"] }
