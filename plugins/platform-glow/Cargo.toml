[package]
name = "microui-plugin-platform-glow"
version = "0.9.0-alpha.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
dynamic-plugin = []

[dependencies]
microui-contracts.workspace = true
microui-ui.workspace = true
microui-redux-renderer-glow.workspace = true
microui-redux-demo-assets = { workspace = true, features = ["prebuilt-atlas"] }
nc-com = { workspace = true, features = ["macros", "std"] }
sdl2.workspace = true
glow.workspace = true
