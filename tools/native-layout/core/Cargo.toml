[package]
name = "neocogi-native-layout-core"
version.workspace = true
publish = ["crates-io"]
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Build-only native output policy and exclusively owned resource staging"

authors.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "build.rs", "tests/**", "schemas/**"]

[dependencies]
tempfile.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
