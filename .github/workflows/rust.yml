name: Rust
on:
  push:
    branches: ["master"]
  pull_request:
permissions:
  contents: read
jobs:
  process-supervision:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Owned process scopes and total output deadlines
        run: |
          cargo test --locked -p neocogi-platform-tools process::tests::
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Native package build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev
      - name: Release archive validation regressions
        run: cargo test --locked -p neocogi-platform-tools
      - name: Extracted packages and independent COM consumer
        run: cargo tools check-packages
  shader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Independent shader validators
        run: sudo apt-get update -qq && sudo apt-get install -y glslang-tools spirv-tools libsdl2-dev libvulkan-dev
      - name: Formatting and direct backend validation
        run: |
          cargo fmt --all -- --check
          for backend in glow vulkan wgpu; do
            NEOCOGI_SHADER_VALIDATORS=1 cargo test --locked -p neocogi-platform --no-default-features --features "$backend,test-support" --test compiler --test sexp_compiler --test compiler_plugin --test shader_optimization
            NEOCOGI_SHADER_VALIDATORS=1 cargo test --locked -p neocogi-platform --no-default-features --features "$backend,test-support,shader-python" --test python_compiler --test shader_targets --test compiler_plugin
          done
          cargo test --locked -p neocogi-platform --features test-support --test gpu_shader_budget
          NEOCOGI_SHADER_VALIDATORS=1 cargo test --locked -p neocogi-platform-examples --no-default-features --features static,vulkan,test-support,shader-python --test shader_corpus
      - name: Built-in Vulkan COM compiler and complete platform byte cap
        run: |
          cargo build --locked -p neocogi-platform-dylib --no-default-features --features vulkan --profile min-size
          NEOCOGI_PLATFORM_DYLIB="$PWD/target/min-size/libnc_platform.so" NEOCOGI_TEST_BACKEND=vulkan NEOCOGI_PLATFORM_SIZE_LIMIT=524288 cargo test --locked -p neocogi-platform --no-default-features --features vulkan,test-support --test compiler_plugin -- --ignored --exact dynamic_platform_plugin_exposes_its_builtin_compiler
          cargo build --locked -p neocogi-platform-dylib --no-default-features --features vulkan,shader-python --profile min-size
          NEOCOGI_PLATFORM_DYLIB="$PWD/target/min-size/libnc_platform.so" NEOCOGI_TEST_BACKEND=vulkan NEOCOGI_TEST_SHADER_PYTHON=1 NEOCOGI_PLATFORM_SIZE_LIMIT=524288 cargo test --locked -p neocogi-platform --no-default-features --features vulkan,test-support --test compiler_plugin -- --ignored --exact dynamic_platform_plugin_exposes_its_builtin_compiler
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [glow, vulkan, wgpu]
    steps:
      - uses: actions/checkout@v6
      - name: Native libraries and software graphics
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb
      - name: Fetch locked dependencies for offline graph tests
        # The graph tests run Cargo offline for backends and target-specific packages
        # that this matrix job may not build. Download every locked dependency first.
        run: cargo fetch --locked
      - name: Platform contracts and compiler
        run: |
          cargo test --locked -p neocogi-platform-contracts --features build-support,test-support
          cargo test --locked -p neocogi-platform --test audio
          cargo test --locked -p neocogi-platform --no-default-features --features ${{ matrix.backend }},test-support
      - name: Minimal compiler output ABI and disabled-format rejection
        run: |
          cargo test --locked -p neocogi-platform --test shader_targets
          cargo test --locked -p neocogi-platform --no-default-features --features ${{ matrix.backend }} --test shader_targets
      - name: Backend-owned native regressions
        run: |
          xvfb-run -a cargo test --locked -p neocogi-platform --no-default-features --features ${{ matrix.backend }},test-support --lib gpu::backends::${{ matrix.backend }}:: -- --include-ignored --test-threads=1
          xvfb-run -a cargo test --locked -p neocogi-platform --no-default-features --features ${{ matrix.backend }},test-support,shader-python --lib gpu::backends::${{ matrix.backend }}:: -- --include-ignored --test-threads=1
      - name: Generated WGSL native validation
        if: matrix.backend == 'wgpu'
        run: cargo test --locked -p neocogi-platform --no-default-features --features wgpu,test-support,shader-python --test sexp_compiler --test python_compiler -- --include-ignored
      - name: Backend acceptance
        run: |
          xvfb-run -a cargo test --locked -p neocogi-platform --lib --test platform_compiler_activation --no-default-features --features ${{ matrix.backend }} -- --include-ignored --test-threads=1
      - name: Standalone graphics application
        run: |
          xvfb-run -a cargo run --locked -p neocogi-platform-examples --bin triangle --no-default-features --features static,${{ matrix.backend }} -- 3
          xvfb-run -a cargo test --locked -p neocogi-platform-examples --test triangle --no-default-features --features static,${{ matrix.backend }} -- --include-ignored --test-threads=1
          xvfb-run -a cargo test --locked -p neocogi-platform-examples --test triangle --no-default-features --features static,${{ matrix.backend }},shader-python -- --include-ignored --test-threads=1
      - name: Pinned glTF example assets
        run: |
          cargo test --locked -p neocogi-platform-tools assets::
          cargo tools fetch-gltf-examples
      - name: glTF import, arcball and native pixel regressions
        run: |
          xvfb-run -a cargo test --locked -p neocogi-platform-examples --test shader_corpus --test gltf_scene --test gltf_environment --test gltf_material --test gltf_camera --test gltf_viewer --no-default-features --features static,${{ matrix.backend }},test-support -- --include-ignored --test-threads=1
      - name: Standalone glTF applications
        run: |
          xvfb-run -a cargo run --locked -p neocogi-platform-examples --bin gltf_damaged_helmet --no-default-features --features static,${{ matrix.backend }} -- --frames 3
          xvfb-run -a cargo run --locked -p neocogi-platform-examples --bin gltf_brainstem --no-default-features --features static,${{ matrix.backend }} -- --frames 3 --time 1
      - name: Dynamic example graphs and relocated shared objects
        run: |
          cargo test --locked -p neocogi-platform-dylib --no-default-features --features ${{ matrix.backend }}
          cargo build --locked -p neocogi-platform-dylib --no-default-features --features ${{ matrix.backend }}
          NEOCOGI_TEST_BACKEND=${{ matrix.backend }} xvfb-run -a cargo test --locked -p neocogi-platform-examples --no-default-features --features dynamic --test graphs --test deployment --test triangle -- --include-ignored --test-threads=1
      - name: Backend warnings
        run: |
          cargo clippy --locked -p neocogi-platform --all-targets --no-default-features --features ${{ matrix.backend }} -- -D warnings
  browser:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v6
      - run: cargo check --locked -p neocogi-platform --target wasm32-unknown-unknown --no-default-features --features webgl,test-support
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Matching Wasm bindings tool
        run: |
          cargo tools install-wasm-bindgen
      - name: Browser harness failure detection
        run: |
          cargo test --locked -p neocogi-platform-tools
      - name: Real DOM and WebGL execution
        run: |
          cargo tools test-browser --browser '${{ steps.chrome.outputs.chrome-path }}'
