name: Rust
on:
  push:
    branches: ["master"]
  pull_request:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Native package build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev
      - name: Release archive validation regressions
        run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Extracted packages and independent COM consumer
        run: python3 -B scripts/check_packages.py
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [glow, vulkan, wgpu]
    steps:
      - uses: actions/checkout@v6
      - name: Native libraries and software graphics
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libsdl2-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri xvfb
      - name: Fetch locked dependencies for offline graph tests
        # The graph tests run Cargo offline for backends and target-specific packages
        # that this matrix job may not build. Download every locked dependency first.
        run: cargo fetch --locked
      - name: Platform contracts and compiler
        run: |
          cargo test --locked -p neocogi-platform-schema --features build-support,test-support
          cargo test --locked -p neocogi-platform --features test-support,shader-spirv,shader-glsl
      - name: Minimal compiler output ABI and disabled-format rejection
        run: |
          cargo test --locked -p neocogi-platform --no-default-features --features shader-compiler --test shader_targets
          cargo test --locked -p neocogi-platform --no-default-features --features shader-compiler,shader-wgsl --test shader_targets
          cargo test --locked -p neocogi-platform --no-default-features --features shader-compiler,shader-spirv --test shader_targets
          cargo test --locked -p neocogi-platform --no-default-features --features shader-compiler,shader-glsl --test shader_targets
          cargo test --locked -p neocogi-platform --no-default-features --features shader-compiler,shader-wgsl,shader-spirv,shader-glsl --test shader_targets
      - name: Backend-owned native regressions
        run: |
          xvfb-run -a cargo test --locked -p neocogi-platform --features ${{ matrix.backend }},test-support --lib gpu::backends::${{ matrix.backend }}:: -- --include-ignored --test-threads=1
      - name: Backend acceptance
        run: |
          xvfb-run -a cargo test --locked -p neocogi-platform --lib --test platform_compiler_activation --no-default-features --features platform,${{ matrix.backend }} -- --include-ignored --test-threads=1
      - name: Standalone graphics application
        run: |
          xvfb-run -a cargo run --locked -p neocogi-platform-examples --bin triangle --no-default-features --features static,${{ matrix.backend }} -- 3
          xvfb-run -a cargo test --locked -p neocogi-platform-examples --test triangle --no-default-features --features static,${{ matrix.backend }} -- --include-ignored --test-threads=1
      - name: Pinned glTF example assets
        run: |
          python3 -m unittest discover -s scripts -p test_fetch_gltf_examples.py
          python3 scripts/fetch_gltf_examples.py
      - name: glTF import, arcball and native pixel regressions
        run: |
          xvfb-run -a cargo test --locked -p neocogi-platform-examples --test gltf_scene --test gltf_environment --test gltf_material --test gltf_camera --test gltf_viewer --no-default-features --features static,${{ matrix.backend }},test-support -- --include-ignored --test-threads=1
      - name: Standalone glTF applications
        run: |
          xvfb-run -a cargo run --locked -p neocogi-platform-examples --bin gltf_damaged_helmet --no-default-features --features static,${{ matrix.backend }} -- --frames 3
          xvfb-run -a cargo run --locked -p neocogi-platform-examples --bin gltf_brainstem --no-default-features --features static,${{ matrix.backend }} -- --frames 3 --time 1
      - name: Dynamic example graphs and relocated shared objects
        run: |
          cargo build --locked -p neocogi-platform-dylib --no-default-features --features ${{ matrix.backend }} --examples
          xvfb-run -a cargo test --locked -p neocogi-platform-examples --no-default-features --features dynamic,${{ matrix.backend }} --test graphs --test deployment --test triangle -- --include-ignored --test-threads=1
      - name: Backend warnings
        run: |
          cargo clippy --locked -p neocogi-platform --all-targets --no-default-features --features platform,${{ matrix.backend }} -- -D warnings
  browser:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v6
      - run: cargo check --locked -p neocogi-platform --target wasm32-unknown-unknown --no-default-features --features platform,webgl,test-support
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Matching Wasm bindings tool
        run: |
          python3 -c 'import subprocess,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["workspace"]["dependencies"]["wasm-bindgen"].lstrip("="); subprocess.run(["cargo","install","wasm-bindgen-cli","--version",v,"--locked"],check=True)'
      - name: Browser harness failure detection
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Real DOM and WebGL execution
        run: |
          python3 scripts/test_browser.py --browser '${{ steps.chrome.outputs.chrome-path }}'
