[package]
name = "neocogi-browser-tests"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
[features]
shader-python = ["neocogi-platform/shader-python"]
[lib]
crate-type = ["cdylib"]
[target.'cfg(target_arch = "wasm32")'.dependencies]
neocogi-platform = { workspace = true, features = ["webgl", "test-support"] }
neocogi-com = { workspace = true, features = ["runtime"] }
neocogi-com-host.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures = "=0.4.77"
