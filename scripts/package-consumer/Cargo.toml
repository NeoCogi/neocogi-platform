[package]
name = "neocogi-package-consumer"
version = "0.3.0-alpha.1"
edition = "2024"
publish = false
[dependencies]
neocogi-platform-contracts = { version = "=0.3.0-alpha.1", default-features = false }
neocogi-com = { version = "=0.2.0", features = ["std", "macros", "runtime"] }
neocogi-com-host = "=0.2.0"
neocogi-platform = { version = "=0.3.0-alpha.1", default-features = false, features = ["glow"] }
# A deployment artifact selected with cargo build -p, never imported as a Rust API.
neocogi-platform-dylib = { version = "=0.3.0-alpha.1", default-features = false, features = ["glow"] }
[build-dependencies]
neocogi-platform-contracts = { version = "=0.3.0-alpha.1", default-features = false, features = ["build-support"] }
serde_json = "1"
