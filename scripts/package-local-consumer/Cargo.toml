[package]
name = "neocogi-package-local-consumer"
version = "0.4.0-alpha.2"
edition = "2024"
publish = false

[dependencies]
neocogi-com-sdk = { version = "=0.4.0-alpha.2", features = ["std", "macros", "runtime"] }
neocogi-com-host = "=0.4.0-alpha.2"

[build-dependencies]
neocogi-platform-contracts = { version = "=0.4.0-alpha.2", default-features = false, features = ["build-support"] }
serde_json = "1"
